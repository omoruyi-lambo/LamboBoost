  <g fill="#38BDF8" opacity="0.75">
    <circle cx="96" cy="118" r="5"/>
    <circle cx="216" cy="192" r="4"/>
    <circle cx="352" cy="148" r="5"/>
    <circle cx="516" cy="242" r="4"/>
    <circle cx="584" cy="118" r="5"/>
    <circle cx="96" cy="402" r="4"/>
    <circle cx="232" cy="342" r="5"/>
    <circle cx="416" cy="424" r="4"/>
    <circle cx="564" cy="344" r="5"/>
  </g>

  <!-- concentric rings -->
  <circle cx="472" cy="300" r="72" stroke="#2563EB" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="472" cy="300" r="48" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="472" cy="300" r="10" fill="#38BDF8" fill-opacity="0.8"/>

  <!-- abstract interface card -->
  <g>
    <rect x="112" y="232" width="168" height="112" rx="18" stroke="#2563EB" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="132" y="254" width="64" height="9" rx="4.5" fill="#2563EB" fill-opacity="0.75"/>
