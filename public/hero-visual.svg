    <rect x="132" y="294" width="88" height="9" rx="4.5" fill="#64748B" fill-opacity="0.5"/>
  </g>

  <!-- small panel -->
  <g>
    <rect x="396" y="86" width="150" height="96" rx="16" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="422" cy="116" r="13" fill="#2563EB" fill-opacity="0.6"/>
    <rect x="448" y="106" width="78" height="8" rx="4" fill="#94A3B8" fill-opacity="0.55"/>
    <rect x="448" y="122" width="58" height="8" rx="4" fill="#64748B" fill-opacity="0.45"/>
