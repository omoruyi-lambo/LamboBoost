  </defs>

  <rect width="640" height="520" rx="32" fill="#0B1220"/>
  <ellipse cx="320" cy="250" rx="300" ry="230" fill="url(#glow)"/>

  <!-- fine connection network -->
  <g stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1">
    <path d="M96 118 L216 192 L352 148"/>
    <path d="M352 148 L516 242 L584 118"/>
    <path d="M96 402 L232 342 L416 424 L564 344"/>
